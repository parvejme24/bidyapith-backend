<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment receipt</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 16px;font-size:22px;color:#111827;">Payment received</h1>
                <p style="margin:0 0 16px;line-height:1.6;">Hi {{firstName}},</p>
                <p style="margin:0 0 16px;line-height:1.6;">
                  We have recorded your payment for invoice <strong>{{invoiceNumber}}</strong>.
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 0 24px;width:100%;border:1px solid #e5e7eb;border-radius:8px;">
                  <tr>
                    <td style="padding:12px 16px;border-bottom:1px solid #e5e7eb;">
                      <span style="color:#6b7280;font-size:13px;">Amount</span><br />
                      <strong style="font-size:20px;">{{amount}} {{currency}}</strong>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:12px 16px;border-bottom:1px solid #e5e7eb;">
                      <span style="color:#6b7280;font-size:13px;">Reference</span><br />
                      <strong>{{transactionRef}}</strong>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:12px 16px;">
                      <span style="color:#6b7280;font-size:13px;">Paid at</span><br />
                      <strong>{{paidAt}}</strong>
                    </td>
                  </tr>
                </table>
                <p style="margin:0;font-size:13px;color:#6b7280;line-height:1.5;">
                  Keep this receipt for your records. The balance on the invoice in Bidyapith is authoritative.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
