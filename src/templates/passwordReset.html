<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your Bidyapith password</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 16px;font-size:22px;color:#111827;">Password reset</h1>
                <p style="margin:0 0 16px;line-height:1.6;">Hi {{firstName}},</p>
                <p style="margin:0 0 24px;line-height:1.6;">
                  We received a request to reset the password for your Bidyapith account. This link can be used only once.
                </p>
                <p style="margin:0 0 32px;">
                  <a href="{{resetUrl}}" style="display:inline-block;background:#1d4ed8;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:bold;">
                    Reset password
                  </a>
                </p>
                <p style="margin:0 0 8px;font-size:13px;color:#6b7280;line-height:1.5;">
                  This link expires in {{expiresIn}}. If you did not request a reset, you can ignore this email — your password will stay the same.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
